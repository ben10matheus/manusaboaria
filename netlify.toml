[build]
  publish = "."

# A ferramenta de manutenção fica somente no computador do responsável.
[[redirects]]
  from = "/manutencao/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ATUALIZAR-FEIRAS.html"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
